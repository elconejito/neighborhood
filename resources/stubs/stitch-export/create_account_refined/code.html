<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Your Account - Neighborhood</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed-variant": "#6d6559",
              "surface": "#f8f9fa",
              "error-dim": "#4e0309",
              "primary-fixed-dim": "#bfd5ff",
              "on-secondary-fixed-variant": "#4d5d73",
              "tertiary-container": "#fdf2e2",
              "inverse-primary": "#b3cdfd",
              "error-container": "#fe8983",
              "on-tertiary-container": "#625b4f",
              "secondary": "#506076",
              "primary-dim": "#39537c",
              "tertiary": "#655e52",
              "on-primary-fixed-variant": "#425c85",
              "on-primary": "#f6f7ff",
              "surface-dim": "#d1dce0",
              "tertiary-fixed-dim": "#efe4d4",
              "on-surface-variant": "#586064",
              "surface-variant": "#dbe4e7",
              "on-secondary-fixed": "#314055",
              "secondary-dim": "#44546a",
              "on-background": "#2b3437",
              "tertiary-fixed": "#fdf2e2",
              "primary": "#455f88",
              "on-secondary-container": "#435368",
              "secondary-fixed": "#d3e4fe",
              "primary-container": "#d6e3ff",
              "surface-tint": "#455f88",
              "on-tertiary-fixed": "#4f493d",
              "surface-container-low": "#f1f4f6",
              "on-error-container": "#752121",
              "primary-fixed": "#d6e3ff",
              "inverse-surface": "#0c0f10",
              "secondary-container": "#d3e4fe",
              "on-secondary": "#f7f9ff",
              "outline": "#737c7f",
              "on-tertiary": "#fff8f0",
              "surface-container-highest": "#dbe4e7",
              "background": "#f8f9fa",
              "secondary-fixed-dim": "#c5d6f0",
              "on-primary-container": "#38527b",
              "inverse-on-surface": "#9b9d9e",
              "on-primary-fixed": "#254067",
              "surface-container-high": "#e3e9ec",
              "surface-bright": "#f8f9fa",
              "tertiary-dim": "#595246",
              "outline-variant": "#abb3b7",
              "on-surface": "#2b3437",
              "on-error": "#fff7f6",
              "error": "#9f403d",
              "surface-container-lowest": "#ffffff",
              "surface-container": "#eaeff1"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .hero-gradient {
            background: linear-gradient(145deg, #455f88 0%, #39537c 100%);
        }
        .input-focus-ring:focus {
            outline: none;
            background-color: #ffffff;
            box-shadow: 0 0 0 1px rgba(69, 95, 136, 0.15);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-6 sm:p-8">
<main class="w-full max-w-xl bg-surface-container-lowest overflow-hidden rounded-xl shadow-[0_12px_40px_rgba(43,52,55,0.05)]">
<!-- Form Section -->
<section class="p-8 sm:p-16 flex flex-col justify-center">
<header class="mb-10 text-center">
<h1 class="text-3xl font-extrabold tracking-tighter text-primary mb-6">Neighborhood</h1>
<h3 class="text-2xl font-extrabold text-on-surface tracking-tight">Create Your Account</h3>
<p class="text-on-surface-variant mt-2 text-sm">Enter your credentials to begin your bespoke journey.</p>
</header>
<form class="space-y-6">
<!-- Full Name Field -->
<div class="space-y-2">
<label class="block text-xs font-bold text-on-surface-variant tracking-wider uppercase" for="name">Full Name</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-lg px-4 py-3 text-on-surface text-sm input-focus-ring transition-all placeholder:text-outline-variant" id="name" name="name" placeholder="Arthur Sterling" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-xs font-bold text-on-surface-variant tracking-wider uppercase" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-lg px-4 py-3 text-on-surface text-sm input-focus-ring transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="sterling@estate.com" type="email"/>
</div>
</div>
<!-- Two Column Layout for Passwords -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-xs font-bold text-on-surface-variant tracking-wider uppercase" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-lg px-4 py-3 text-on-surface text-sm input-focus-ring transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-2">
<label class="block text-xs font-bold text-on-surface-variant tracking-wider uppercase" for="confirm_password">Confirm</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-lg px-4 py-3 text-on-surface text-sm input-focus-ring transition-all placeholder:text-outline-variant" id="confirm_password" name="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<div class="flex items-start pt-2">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-primary focus:ring-primary/20 border-surface-variant rounded" id="terms" name="terms" type="checkbox"/>
</div>
<div class="ml-3 text-xs">
<label class="text-on-surface-variant leading-relaxed" for="terms">
                            I agree to the <a class="text-primary font-bold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-bold hover:underline" href="#">Privacy Protocol</a>.
                        </label>
</div>
</div>
<button class="w-full hero-gradient text-on-primary py-4 rounded-xl font-bold tracking-tight shadow-sm hover:opacity-95 active:scale-[0.98] transition-all" type="submit">
                    Create Account
                </button>
<div class="relative py-4">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-surface-variant/50"></div></div>
<div class="relative flex justify-center text-xs uppercase tracking-widest"><span class="bg-surface-container-lowest px-4 text-outline-variant">Partner Access</span></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 bg-surface-container-low py-3 rounded-lg text-sm font-semibold text-on-surface hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-lg" data-icon="google">google</span> Google
                    </button>
<button class="flex items-center justify-center gap-2 bg-surface-container-low py-3 rounded-lg text-sm font-semibold text-on-surface hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-lg" data-icon="apple">ios</span> Apple
                    </button>
</div>
</form>
<footer class="mt-12 text-center">
<p class="text-sm text-on-surface-variant">
                    Already registered? <a class="text-primary font-extrabold tracking-tight hover:underline" href="#">Sign In to Dashboard</a>
</p>
</footer>
</section>
</main>
<!-- Contextual Aesthetic Note -->
<div class="fixed bottom-8 left-8 hidden lg:flex items-center gap-4 animate-pulse">
<div class="h-px w-8 bg-outline-variant/30"></div>
<span class="text-[10px] uppercase tracking-[0.2em] text-outline-variant font-medium">Neighborhood v1.0.0</span>
</div>
</body></html>
